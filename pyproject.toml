[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-chatgpt-voice"
dynamic = ["version"]
description = "Local browser-backed voice controller for Yandex Station Midi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
midivoice = "midivoice.cli:main"

[tool.setuptools]
packages = ["midivoice"]

[tool.setuptools.dynamic]
version = {attr = "midivoice.__version__"}

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
